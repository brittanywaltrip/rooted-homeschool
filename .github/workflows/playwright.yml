name: Playwright Smoke Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 12 min waiting for the deployment + ~10 min of tests, with headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ONE gate, parsed as JSON. Waits for the deployment of THIS COMMIT and
      # asserts every field: a healthy response from an older build is not
      # sufficient. curl is never given --location, so the bypass header cannot
      # follow a redirect to another origin.
      - name: Wait for, and verify, the staging deployment of this commit
        env:
          PLAYWRIGHT_BASE_URL: https://rooted-homeschool-env-rooted-staging-brittanywaltrips-projects.vercel.app
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECTED_REF: cvgqovweybggrqakhdtd
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            body=$(curl -sS --max-time 10 \
              -H "x-vercel-protection-bypass: ${BYPASS}" \
              "${PLAYWRIGHT_BASE_URL}/api/health" || echo '')
            if [ -n "${body}" ] && echo "${body}" | jq -e '.commit' >/dev/null 2>&1; then
              commit=$(echo "${body}" | jq -r '.commit // empty')
              if [ "${commit}" = "${GITHUB_SHA}" ]; then
                echo "${body}" | jq .
                echo "${body}" | jq -e --arg ref "${EXPECTED_REF}" '
                  if .env        != "staging" then error("env is \(.env), not staging")
                  elif .identityOk != true    then error("identityOk is false: \(.error)")
                  elif .projectRef != $ref    then error("projectRef is \(.projectRef), not \($ref)")
                  else true end' >/dev/null
                echo "verified: staging @ ${commit}"
                exit 0
              fi
              echo "deployment serves ${commit:-unknown}, waiting for ${GITHUB_SHA} ($i/48)…"
            else
              echo "no health response yet ($i/48)…"
            fi
            sleep 15
          done
          echo "::error::no staging deployment serving ${GITHUB_SHA} after 12 minutes"
          exit 1

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://rooted-homeschool-env-rooted-staging-brittanywaltrips-projects.vercel.app
          # Staging-only secrets. The production-named secrets are deliberately
          # NOT referenced, so re-adding them cannot silently re-point this job.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_EMAIL: ${{ secrets.STAGING_PLAYWRIGHT_EMAIL }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.STAGING_PLAYWRIGHT_PASSWORD }}
          # Both required by lib/env-identity; a missing one is itself a refusal.
          ROOTED_ENV: staging
          ROOTED_EXPECTED_SUPABASE_REF: cvgqovweybggrqakhdtd
          # Consumed ONLY by global-setup, which installs it as an origin-scoped
          # cookie. It is never placed in Playwright's extraHTTPHeaders, which
          # would send it to Supabase, PostHog and Sentry on every request.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/smoke/

      # Two independent layers, because one is not enough.
      #
      # 1. playwright.config sets trace/video/screenshot to 'off' under CI, so
      #    nothing carrying the bypass cookie is ever RECORDED.
      # 2. playwright-report/data/ is excluded regardless. That directory is
      #    where every attachment lands, and the trace is named <sha1>.zip, not
      #    trace.zip, so a filename pattern misses it. Verified by generating a
      #    real report and searching the whole tree, zipped contents included.
      #
      # e2e/.auth/ holds live session tokens; it is gitignored and outside this
      # path, so it is never collected.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            !playwright-report/data/**
