name: Playwright Smoke Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    # Fork PRs never receive staging credentials or the protection bypass.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: rooted-staging-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 12 min waiting for the deployment + ~10 min of tests, with headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Discover the immutable deployment for this exact commit. Never move a
      # shared staging alias or accept an older build just to make CI green.
      - name: Discover and verify this commit's staging deployment
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/smoke-deployment.mjs

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.base_url }}
          # Staging-only secrets. The production-named secrets are deliberately
          # NOT referenced, so re-adding them cannot silently re-point this job.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_EMAIL: ${{ secrets.STAGING_PLAYWRIGHT_EMAIL }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.STAGING_PLAYWRIGHT_PASSWORD }}
          # Both required by lib/env-identity; a missing one is itself a refusal.
          ROOTED_ENV: staging
          ROOTED_EXPECTED_SUPABASE_REF: cvgqovweybggrqakhdtd
          # Same reason as the gate step: global-setup falls back to GITHUB_SHA,
          # which is the merge commit here.
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # Consumed ONLY by global-setup, which installs it as an origin-scoped
          # cookie. It is never placed in Playwright's extraHTTPHeaders, which
          # would send it to Supabase, PostHog and Sentry on every request.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # A named-test reporter: the default in CI is "dot", which reports
          # "9 skipped" without saying which. The JSON report is read by the
          # next step and is never uploaded (it sits outside playwright-report/).
          PLAYWRIGHT_JSON_OUTPUT_NAME: smoke-results.json
        run: npx playwright test e2e/smoke/ --reporter=list,json

      # Every skipped test by name, with the reason it gave, in the log and the
      # job summary. Titles and skip reasons only.
      - name: List skipped smoke tests
        if: always()
        run: |
          if [ -f smoke-results.json ]; then node scripts/smoke-skips.mjs smoke-results.json; else echo "no smoke-results.json (the run did not start)"; fi

      # Two independent layers, because one is not enough.
      #
      # 1. playwright.config sets trace/video/screenshot to 'off' under CI, so
      #    nothing carrying the bypass cookie is ever RECORDED.
      # 2. playwright-report/data/ is excluded regardless. That directory is
      #    where every attachment lands, and the trace is named <sha1>.zip, not
      #    trace.zip, so a filename pattern misses it. Verified by generating a
      #    real report and searching the whole tree, zipped contents included.
      #
      # e2e/.auth/ holds live session tokens; it is gitignored and outside this
      # path, so it is never collected.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            !playwright-report/data/**
