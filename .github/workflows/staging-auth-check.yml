name: Staging credential check
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rooted-staging-smoke
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify normal synthetic logins without saving sessions
        env:
          EXPECTED_SOURCE: ${{ inputs.reviewed_commit }}
          ACTUAL_SOURCE: ${{ github.workflow_sha }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          OWNER_EMAIL: ${{ secrets.STAGING_PLAYWRIGHT_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.STAGING_PLAYWRIGHT_PASSWORD }}
          CONTROL_EMAIL: ${{ secrets.STAGING_CONTROL_EMAIL }}
          CONTROL_PASSWORD: ${{ secrets.STAGING_CONTROL_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root = 'https://cvgqovweybggrqakhdtd.supabase.co';
          const env = process.env;
          function refuse(code) { throw new Error(code); }
          async function check(label, email, password, expectedId) {
            if (!email || !password) refuse(label + '_credential_missing');
            let token;
            try {
              const login = await fetch(root + '/auth/v1/token?grant_type=password', {
                method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10000),
                headers: { apikey: env.STAGING_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
              });
              if (!login.ok) refuse(label + '_login_refused');
              const session = await login.json();
              token = session.access_token;
              if (!token || session.user?.id !== expectedId) refuse(label + '_identity_mismatch');
              const user = await fetch(root + '/auth/v1/user', {
                redirect: 'error', signal: AbortSignal.timeout(10000),
                headers: { apikey: env.STAGING_ANON_KEY, Authorization: 'Bearer ' + token }
              });
              if (!user.ok || (await user.json()).id !== expectedId) refuse(label + '_identity_unverified');
              console.log(label + ': verified expected synthetic identity');
            } finally {
              if (token) {
                const logout = await fetch(root + '/auth/v1/logout?scope=local', {
                  method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10000),
                  headers: { apikey: env.STAGING_ANON_KEY, Authorization: 'Bearer ' + token }
                });
                if (!logout.ok) refuse(label + '_session_cleanup_unverified');
              }
            }
          }
          try {
            if (!/^[a-f0-9]{40}$/.test(env.EXPECTED_SOURCE ?? '') || env.ACTUAL_SOURCE !== env.EXPECTED_SOURCE) refuse('source_identity_refused');
            if (env.STAGING_URL?.replace(/\/$/, '') !== root || !env.STAGING_ANON_KEY) refuse('staging_configuration_refused');
            const key = env.STAGING_ANON_KEY;
            if (!key.startsWith('sb_publishable_')) {
              const parts = key.split('.');
              if (parts.length !== 3) refuse('anon_key_refused');
              const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
              if (claims.role !== 'anon' || (claims.ref && claims.ref !== 'cvgqovweybggrqakhdtd')) refuse('anon_key_refused');
            }
            await check('owner', env.OWNER_EMAIL, env.OWNER_PASSWORD, '1954d827-ac7d-41e8-aeef-f8e07d4337a4');
            if (env.CONTROL_EMAIL || env.CONTROL_PASSWORD) {
              await check('control', env.CONTROL_EMAIL, env.CONTROL_PASSWORD, '11111111-1111-4111-8111-000000000005');
            } else {
              console.log('control: credential not configured; two-owner verification blocked');
              process.exitCode = 2;
            }
          } catch (error) {
            const safe = /^(owner|control)_(credential_missing|login_refused|identity_mismatch|identity_unverified|session_cleanup_unverified)$|^(staging_configuration_refused|source_identity_refused|anon_key_refused)$/;
            console.error(safe.test(error.message) ? error.message : 'credential_check_failed');
            process.exitCode = 1;
          }
          NODE
